<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 140" role="img" aria-label="Olasco Roofing Engineering" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Olasco Roofing Engineering</title>
  <style>
    .roof{stroke-dasharray:100;stroke-dashoffset:100;animation:draw 1.1s ease-out forwards}
    .bolt{opacity:0;animation:fade .4s ease-out 1s forwards}
    .win{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .6s ease-out 1s forwards}
    .mv{transform-box:fill-box;transform-origin:center;transform:scaleY(0);animation:growy .5s ease-out 1.5s forwards}
    .mh{transform-box:fill-box;transform-origin:center;transform:scaleX(0);animation:growx .5s ease-out 1.6s forwards}
    .base{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:growx .6s ease-out 1.3s forwards}
    .word{opacity:0;animation:slide .7s ease-out 1.6s forwards}
    .tag{opacity:0;animation:fade .6s ease-out 2.1s forwards}
    @keyframes draw{to{stroke-dashoffset:0}}
    @keyframes fade{to{opacity:1}}
    @keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
    @keyframes growy{to{transform:scaleY(1)}}
    @keyframes growx{to{transform:scaleX(1)}}
    @keyframes slide{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
    @media (prefers-reduced-motion: reduce){
      *{animation:none!important}
      .roof{stroke-dashoffset:0}
      .bolt,.win,.word,.tag{opacity:1}
      .mv,.mh,.base{transform:none}
    }
  </style>
  <!-- Roof gable (navy) -->
  <polyline class="roof" pathLength="100" points="12,92 70,22 128,92" fill="none" stroke="#0B2545" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Window frame and mullions (orange frame, navy bars) -->
  <rect class="win" x="52" y="56" width="36" height="36" rx="2" fill="none" stroke="#F08A24" stroke-width="5"/>
  <line class="mv" x1="70" y1="56" x2="70" y2="92" stroke="#0B2545" stroke-width="3"/>
  <line class="mh" x1="52" y1="74" x2="88" y2="74" stroke="#0B2545" stroke-width="3"/>
  <!-- Bolt at the apex (engineering detail) -->
  <circle class="bolt" cx="70" cy="22" r="6" fill="#F08A24" stroke="#0B2545" stroke-width="2"/>
  <!-- Base line -->
  <rect class="base" x="6" y="103" width="128" height="6" rx="3" fill="#F08A24"/>
  <!-- Wordmark -->
  <text class="word" x="148" y="76" font-family="Poppins, Inter, Arial, Helvetica, sans-serif" font-size="62" font-weight="800" letter-spacing="2" fill="#0B2545">OLASCO</text>
  <text class="tag" x="150" y="108" font-family="Poppins, Inter, Arial, Helvetica, sans-serif" font-size="19" font-weight="600" letter-spacing="4.2" fill="#F08A24">ROOFING ENGINEERING</text>
</svg>
